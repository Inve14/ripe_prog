<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 01 - fetch GET semplice</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

  <h1>Esempio 01 — fetch GET semplice</h1>
  <p>
    Clicca il pulsante per chiedere la lista di utenti a una API pubblica
    (<code>https://jsonplaceholder.typicode.com/users</code>) e mostrarla in tabella.
  </p>

  <!-- pulsante che fa partire la richiesta -->
  <button type="button" id="btnCarica" class="btn btn-primary mb-3">Carica utenti</button>

  <!-- tabella Bootstrap dove verranno inseriti i risultati -->
  <table class="table table-striped" id="tabellaUtenti"></table>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
