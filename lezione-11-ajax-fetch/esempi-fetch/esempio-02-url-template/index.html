<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 02 - fetch GET con URL dinamica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

  <h1>Esempio 02 — fetch GET con URL dinamica (URL template)</h1>
  <p>
    Scrivi un ingrediente (es. <code>vodka</code>, <code>gin</code>, <code>rum</code>) e cerca
    tutti i cocktail che lo contengono, usando la CocktailDB.
  </p>

  <div class="row g-2 mb-3">
    <div class="col-auto">
      <label for="inputIngrediente" class="col-form-label">Ingrediente</label>
    </div>
    <div class="col-auto">
      <input type="text" id="inputIngrediente" class="form-control" placeholder="es. vodka">
    </div>
    <div class="col-auto">
      <button type="button" id="btnCerca" class="btn btn-primary">Cerca</button>
    </div>
  </div>

  <table class="table table-striped" id="tabellaCocktail"></table>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
