<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Mini pratica - Meteo con fetch (soluzione)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

  <h1>Mini pratica — Meteo con fetch (SOLUZIONE)</h1>
  <p>
    Scrivi latitudine e longitudine, clicca "Cerca meteo" e vedrai temperatura
    e velocità del vento attuali, letti dalla API gratuita Open-Meteo.
  </p>

  <div class="row g-2 mb-3">
    <div class="col-auto">
      <label for="inputLat" class="col-form-label">Latitudine</label>
    </div>
    <div class="col-auto">
      <input type="text" id="inputLat" class="form-control" placeholder="es. 41.9">
    </div>
    <div class="col-auto">
      <label for="inputLon" class="col-form-label">Longitudine</label>
    </div>
    <div class="col-auto">
      <input type="text" id="inputLon" class="form-control" placeholder="es. 12.5">
    </div>
    <div class="col-auto">
      <button type="button" id="btnCerca" class="btn btn-primary">Cerca meteo</button>
    </div>
  </div>

  <div id="risultato" class="fs-4"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mini-pratica-soluzione.js"></script>
</body>
</html>
