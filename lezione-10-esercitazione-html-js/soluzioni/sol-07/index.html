<!--
  SOL-07 - Maggiore e minore
  Quattro input numerici e un pulsante. Al click, mostra il valore
  maggiore e il valore minore tra i quattro inseriti.
  Concetti: array, sort, valori vuoti gestiti con || 0
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-07 - Maggiore e minore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Maggiore e minore</h1>

    <div class="row g-2 mb-3">
      <div class="col">
        <label for="numero1" class="form-label">Numero 1</label>
        <input type="number" id="numero1" class="form-control">
      </div>
      <div class="col">
        <label for="numero2" class="form-label">Numero 2</label>
        <input type="number" id="numero2" class="form-control">
      </div>
      <div class="col">
        <label for="numero3" class="form-label">Numero 3</label>
        <input type="number" id="numero3" class="form-control">
      </div>
      <div class="col">
        <label for="numero4" class="form-label">Numero 4</label>
        <input type="number" id="numero4" class="form-control">
      </div>
    </div>

    <button id="btnCalcola" class="btn btn-primary mb-4">Calcola</button>

    <div id="risultato" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
