<!--
  SOL-06 - Lista della spesa
  Un input e un pulsante "Aggiungi" che aggiunge elementi a una lista (ul).
  Un pulsante "Svuota" cancella tutta la lista.
  Concetti: array, innerHTML +=, render()
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-06 - Lista della spesa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Lista della spesa</h1>

    <div class="mb-3">
      <label for="inputProdotto" class="form-label">Prodotto</label>
      <input type="text" id="inputProdotto" class="form-control">
    </div>

    <button id="btnAggiungi" class="btn btn-primary mb-2">Aggiungi</button>
    <button id="btnSvuota" class="btn btn-outline-danger mb-4">Svuota</button>

    <ul id="lista" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
