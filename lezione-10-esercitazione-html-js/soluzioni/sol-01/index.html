<!--
  SOL-01 - Saluto personalizzato
  Un input di testo e un pulsante "Saluta". Al click, mostra nel div
  sottostante il messaggio "Ciao [nome]!" usando il nome scritto nell'input.
  Concetti: querySelector, .value, onclick, innerHTML
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-01 - Saluto personalizzato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Saluto personalizzato</h1>

    <div class="mb-3">
      <label for="inputNome" class="form-label">Il tuo nome</label>
      <input type="text" id="inputNome" class="form-control">
    </div>

    <button id="btnSaluta" class="btn btn-primary mb-4">Saluta</button>

    <div id="messaggio" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
