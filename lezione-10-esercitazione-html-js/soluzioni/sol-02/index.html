<!--
  SOL-02 - Cambia colore
  Un div colorato e tre pulsanti (Rosso, Verde, Blu). Ogni pulsante, al click,
  cambia il colore di sfondo del div con quello corrispondente.
  Concetti: onclick, style.backgroundColor
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-02 - Cambia colore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Cambia colore</h1>

    <div id="scatola" class="mb-4" style="height: 150px; background-color: lightgray; border-radius: 8px;"></div>

    <button id="btnRosso" class="btn btn-danger">Rosso</button>
    <button id="btnVerde" class="btn btn-success">Verde</button>
    <button id="btnBlu" class="btn btn-primary">Blu</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
