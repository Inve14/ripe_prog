<!--
  SOL-03 - Contatore
  Pulsante "+" e pulsante "-". Mostra il numero aggiornato.
  Il numero non scende mai sotto lo 0.
  Concetti: variabile esterna, if per il limite
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-03 - Contatore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5 text-center" style="max-width: 400px;">
    <h1 class="mb-4">Contatore</h1>

    <div id="numero" class="display-4 mb-4">0</div>

    <button id="btnMeno" class="btn btn-outline-secondary">-</button>
    <button id="btnPiu" class="btn btn-primary">+</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
