<!--
  ES-05 - Calcolatrice semplice
  Consegna: due input numerici, un select con le operazioni +/-/*/÷ e un
  pulsante "Calcola". Mostra il risultato, gestendo i dati non validi.
  Concetti: parseFloat, if/else sull'operazione, isNaN
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-05 - Calcolatrice semplice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Calcolatrice semplice</h1>

    <div class="row g-2 mb-3">
      <div class="col">
        <label for="numero1" class="form-label">Primo numero</label>
        <input type="number" id="numero1" class="form-control">
      </div>
      <div class="col-auto">
        <label for="operazione" class="form-label">Operazione</label>
        <select id="operazione" class="form-select">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">÷</option>
        </select>
      </div>
      <div class="col">
        <label for="numero2" class="form-label">Secondo numero</label>
        <input type="number" id="numero2" class="form-control">
      </div>
    </div>

    <button id="btnCalcola" class="btn btn-primary mb-4">Calcola</button>

    <div id="risultato" class="alert alert-secondary"></div>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
