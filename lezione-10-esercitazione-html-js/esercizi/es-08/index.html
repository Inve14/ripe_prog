<!--
  ES-08 - Tabella studenti
  Consegna: form con nome e voto. Ogni submit aggiunge una riga a una
  tabella Bootstrap, con un badge verde "Promosso" o rosso "Bocciato"
  in base al voto. Un pulsante "Svuota" cancella tutta la tabella.
  Concetti: array di dizionari, render() che ricrea la tabella, template.replace
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-08 - Tabella studenti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 700px;">
    <h1 class="mb-4">Tabella studenti</h1>

    <form id="formStudente" class="row g-2 mb-4">
      <div class="col">
        <label for="inputNome" class="form-label">Nome</label>
        <input type="text" id="inputNome" class="form-control" required>
      </div>
      <div class="col">
        <label for="inputVoto" class="form-label">Voto</label>
        <input type="number" id="inputVoto" class="form-control" min="0" max="10" required>
      </div>
      <div class="col-auto align-self-end">
        <button type="submit" class="btn btn-primary">Aggiungi</button>
      </div>
    </form>

    <table class="table table-bordered align-middle">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Voto</th>
          <th>Esito</th>
        </tr>
      </thead>
      <tbody id="corpoTabella"></tbody>
    </table>

    <button id="btnSvuota" class="btn btn-outline-danger">Svuota</button>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
