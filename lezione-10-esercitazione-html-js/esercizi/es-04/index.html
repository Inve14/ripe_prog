<!--
  ES-04 - Caratteri in tempo reale
  Consegna: una textarea e un div che mostra "Hai scritto X caratteri",
  aggiornato ad ogni tasto premuto (non serve nessun pulsante).
  Concetti: oninput, .value.length
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-04 - Caratteri in tempo reale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Caratteri in tempo reale</h1>

    <div class="mb-3">
      <label for="testo" class="form-label">Scrivi qualcosa</label>
      <textarea id="testo" class="form-control" rows="4"></textarea>
    </div>

    <div id="conteggio" class="alert alert-secondary">Hai scritto 0 caratteri</div>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
