<!--
  ES-19 — Salva e leggi
  CONSEGNA:
  Due form: il primo salva chiave-valore in cache remota (POST set),
  il secondo legge il valore dalla chiave (POST get).
-->
<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>ES-19 - Salva e leggi</title>
</head>

<body>
  <h3>Inserisci chiave e valore e poi clicca "salva"</h3>
  <div>
    <input type="text" id="chiaveInput">
    <input type="text" id="valoreInput">
  </div>
  <button id="btnSalva">salva</button>

  <div id="outputSalva"></div>

  <h3>Inserisci chiave e clicca "leggi"</h3>
  <div>
    <input type="text" id="leggiChiave">
  </div>
  <button id="btnLeggi">leggi</button>

  <div id="outputLeggi"></div>

  <script src="prova.js"></script>
</body>

</html>
