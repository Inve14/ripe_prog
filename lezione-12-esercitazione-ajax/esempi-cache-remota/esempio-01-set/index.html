<!--
  ESEMPIO 1 - Cache Remota: solo SALVATAGGIO (SET)
  Vedi spiegazione-cache-remota.md nella cartella sopra per la teoria.
  Qui vediamo, passo passo, solo la parte per salvare un valore.
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 1 - Cache Remota: SET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-3">Salva un valore</h1>
    <p class="text-muted">Apri la Console (F12) prima di cliccare: vedrai stampato tutto quello che succede.</p>

    <div class="mb-3">
      <label for="inputChiave" class="form-label">Chiave (l'etichetta)</label>
      <input type="text" id="inputChiave" class="form-control" value="colore-preferito">
    </div>

    <div class="mb-3">
      <label for="inputValore" class="form-label">Valore (il contenuto)</label>
      <input type="text" id="inputValore" class="form-control" value="blu">
    </div>

    <button id="btnSalva" class="btn btn-primary mb-4">Salva</button>

    <div id="esito" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
