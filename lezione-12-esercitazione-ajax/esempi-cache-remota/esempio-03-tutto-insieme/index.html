<!--
  ESEMPIO 3 - Cache Remota: tutto insieme (SET + GET in sequenza)
  Vedi spiegazione-cache-remota.md nella cartella sopra per la teoria.
  Un unico pulsante: prima salva un valore, POI lo rilegge subito dopo,
  per dimostrare che il giro completo funziona davvero (quello che
  scrivo è proprio quello che poi ritrovo).
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 3 - Cache Remota: tutto insieme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-3">Salva e rileggi</h1>
    <p class="text-muted">Apri la Console (F12): vedrai in ordine la richiesta di salvataggio e subito dopo quella di lettura.</p>

    <div class="mb-3">
      <label for="inputChiave" class="form-label">Chiave</label>
      <input type="text" id="inputChiave" class="form-control" value="animale-preferito">
    </div>

    <div class="mb-3">
      <label for="inputValore" class="form-label">Valore</label>
      <input type="text" id="inputValore" class="form-control" value="gatto">
    </div>

    <button id="btnProva" class="btn btn-primary mb-4">Salva e rileggi subito</button>

    <div id="esito" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
