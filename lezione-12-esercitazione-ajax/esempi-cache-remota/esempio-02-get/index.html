<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 2 - Cache Remota: GET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-3">Leggi un valore</h1>
    <p class="text-muted">Apri la Console (F12) prima di cliccare: vedrai stampato tutto quello che succede.</p>

    <div class="mb-3">
      <label for="inputChiave" class="form-label">Chiave da cercare</label>
      <input type="text" id="inputChiave" class="form-control" value="colore-preferito">
    </div>

    <button id="btnLeggi" class="btn btn-primary mb-4">Leggi</button>

    <div id="esito" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
