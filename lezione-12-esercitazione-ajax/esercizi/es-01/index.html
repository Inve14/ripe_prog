<!--
  ES-01 - Fetch GET semplice
  Consegna: un pulsante "Carica utenti". Al click, scarica la lista utenti
  da https://jsonplaceholder.typicode.com/users e mostrala in una tabella
  Bootstrap con le colonne ID, Nome, Email.
  Concetti: fetch, await, response.json(), for...of per costruire la tabella
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-01 - Fetch GET semplice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 700px;">
    <h1 class="mb-4">Lista utenti</h1>

    <button id="btnCarica" class="btn btn-primary mb-4">Carica utenti</button>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
        </tr>
      </thead>
      <!-- qui dentro andranno le righe generate dal JS -->
      <tbody id="tbodyUtenti"></tbody>
    </table>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
