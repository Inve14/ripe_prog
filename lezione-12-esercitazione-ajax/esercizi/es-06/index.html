<!--
  ES-06 - Cache remota SET + GET
  Consegna: unisci ES-04 ed ES-05 in una sola pagina, con due form
  separati: uno per salvare una coppia chiave/valore, uno per rileggerla.
  Concetti: due fetch POST nella stessa pagina
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-06 - Cache remota SET + GET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Cache remota</h1>

    <!-- FORM 1: salva -->
    <h2 class="h5">Salva</h2>
    <div class="mb-3">
      <label for="inputChiaveSet" class="form-label">Chiave</label>
      <input type="text" id="inputChiaveSet" class="form-control" placeholder="es. colore-preferito">
    </div>
    <div class="mb-3">
      <label for="inputValoreSet" class="form-label">Valore</label>
      <input type="text" id="inputValoreSet" class="form-control" placeholder="es. blu">
    </div>
    <button id="btnSalva" class="btn btn-primary mb-2">Salva</button>
    <div id="esitoSalva" class="alert alert-secondary"></div>

    <hr class="my-4">

    <!-- FORM 2: leggi -->
    <h2 class="h5">Leggi</h2>
    <div class="mb-3">
      <label for="inputChiaveGet" class="form-label">Chiave</label>
      <input type="text" id="inputChiaveGet" class="form-control" placeholder="es. colore-preferito">
    </div>
    <button id="btnLeggi" class="btn btn-primary mb-2">Leggi</button>
    <div id="esitoLeggi" class="alert alert-secondary"></div>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
