<!--
  ES-04 - Cache remota SET
  Consegna: un form con chiave e valore e un pulsante "Salva". Al click,
  manda una fetch POST a https://ws.cipiaceinfo.it/cache/set per salvare
  la coppia chiave/valore, usando il token del prof. Mostra un messaggio
  di conferma.
  Concetti: fetch POST, headers, body, JSON.stringify
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-04 - Cache remota SET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Salva in cache</h1>

    <div class="mb-3">
      <label for="inputChiave" class="form-label">Chiave</label>
      <input type="text" id="inputChiave" class="form-control" placeholder="es. colore-preferito">
    </div>

    <div class="mb-3">
      <label for="inputValore" class="form-label">Valore</label>
      <input type="text" id="inputValore" class="form-control" placeholder="es. blu">
    </div>

    <button id="btnSalva" class="btn btn-primary mb-4">Salva</button>

    <div id="esito" class="alert alert-secondary"></div>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
