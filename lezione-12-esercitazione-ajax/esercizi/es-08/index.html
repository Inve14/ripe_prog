<!--
  ES-08 - Film di tendenza
  Consegna: un pulsante "Carica film". Al click, scarica i film di
  tendenza del giorno da TheMovieDB (TMDB) usando la chiave API fornita, e
  mostra titolo, immagine (poster) e voto di ogni film in una card
  Bootstrap.
  Concetti: fetch con chiave API, dati annidati
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-08 - Film di tendenza</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">Film di tendenza</h1>

    <button id="btnCarica" class="btn btn-primary mb-4">Carica film</button>

    <!-- qui dentro andranno le card generate dal JS, in griglia -->
    <div id="risultatoFilm" class="row row-cols-1 row-cols-md-4 g-4"></div>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
