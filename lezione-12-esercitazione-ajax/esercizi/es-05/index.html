<!--
  ES-05 - Cache remota GET
  Consegna: un input chiave e un pulsante "Leggi". Al click, manda una
  fetch POST a https://ws.cipiaceinfo.it/cache/get per leggere il valore
  salvato con quella chiave. Mostra il valore trovato, oppure un messaggio
  di errore se la chiave non esiste.
  Concetti: fetch POST, gestione risposta null
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ES-05 - Cache remota GET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Leggi dalla cache</h1>

    <div class="mb-3">
      <label for="inputChiave" class="form-label">Chiave</label>
      <input type="text" id="inputChiave" class="form-control" placeholder="es. colore-preferito">
    </div>

    <button id="btnLeggi" class="btn btn-primary mb-4">Leggi</button>

    <div id="esito" class="alert alert-secondary"></div>
  </div>

  <!-- Il JS è già collegato: scrivete il codice in script.js -->
  <script src="script.js"></script>
</body>
</html>
