<!--
  SOL-03 - Meteo
  Consegna: due input (latitudine e longitudine) e un pulsante "Cerca meteo".
  Al click, scarica il meteo attuale da Open-Meteo e mostra temperatura e
  vento.
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-03 - Meteo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Meteo attuale</h1>

    <div class="mb-3">
      <label for="inputLat" class="form-label">Latitudine</label>
      <input type="text" id="inputLat" class="form-control" value="41.9">
    </div>

    <div class="mb-3">
      <label for="inputLon" class="form-label">Longitudine</label>
      <input type="text" id="inputLon" class="form-control" value="12.5">
    </div>

    <button id="btnCerca" class="btn btn-primary mb-4">Cerca meteo</button>

    <div id="risultato" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
