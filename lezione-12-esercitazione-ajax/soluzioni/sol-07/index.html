<!--
  SOL-07 - CocktailDB
  Consegna: un input testo (nome del cocktail) e un pulsante "Cerca". Al
  click, mostra una tabella con id, nome e immagine dei cocktail trovati,
  gestendo il caso in cui non ne trovi nessuno.
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-07 - CocktailDB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 700px;">
    <h1 class="mb-4">Cerca cocktail</h1>

    <div class="mb-3">
      <label for="inputNome" class="form-label">Nome del cocktail</label>
      <input type="text" id="inputNome" class="form-control" placeholder="es. margarita">
    </div>

    <button id="btnCerca" class="btn btn-primary mb-4">Cerca</button>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Immagine</th>
        </tr>
      </thead>
      <tbody id="tbodyCocktail"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
