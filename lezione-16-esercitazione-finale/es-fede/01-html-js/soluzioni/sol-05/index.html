<!--
  SOL-05 - Lista dinamica
  Input + "Aggiungi" + "Svuota". Lista <ul> con array + render().
  Concetti: array, innerHTML, render()
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-05 - Lista dinamica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Lista dinamica</h1>

    <div class="input-group mb-3">
      <input type="text" id="inputElemento" class="form-control" placeholder="Nuovo elemento">
      <button id="btnAggiungi" class="btn btn-primary">Aggiungi</button>
      <button id="btnSvuota" class="btn btn-outline-danger">Svuota</button>
    </div>

    <ul id="lista" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
