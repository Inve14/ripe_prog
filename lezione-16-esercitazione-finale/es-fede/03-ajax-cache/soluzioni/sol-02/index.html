<!--
  SOL-02 - Fetch GET con URL template
  Input userId + pulsante. Fetch dei post di quell'utente, lista di titoli.
  Concetti: URL template con .replace()
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-02 - Fetch GET con URL template</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">Post per utente</h1>

    <div class="input-group mb-4" style="max-width: 400px;">
      <input type="number" id="inputUserId" class="form-control" placeholder="ID utente">
      <button id="btnCerca" class="btn btn-primary">Cerca</button>
    </div>

    <ul id="listaPost" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
