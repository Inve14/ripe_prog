<!--
  SOL-07 - Cache remota GET
  Input chiave + pulsante "Leggi". POST sulla cache remota, mostra il valore.
  Concetti: fetch POST, gestione risposta
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-07 - Cache remota GET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">Leggi da cache</h1>

    <div class="input-group mb-4" style="max-width: 400px;">
      <input type="text" id="inputChiave" class="form-control" placeholder="Chiave">
      <button id="btnLeggi" class="btn btn-primary">Leggi</button>
    </div>

    <div id="risultato" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
