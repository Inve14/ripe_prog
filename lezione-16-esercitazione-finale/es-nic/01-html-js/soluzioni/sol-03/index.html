<!--
  SOL-03 - Contatore con limiti
  Pulsante "+" e "-", non scende sotto 0 e non sale sopra 10.
  Concetti: variabile esterna, if per i limiti, render()
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-03 - Contatore con limiti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5 text-center" style="max-width: 400px;">
    <h1 class="mb-4">Contatore</h1>

    <h2 id="valore" class="display-4 mb-4">0</h2>

    <button id="btnMeno" class="btn btn-danger">-</button>
    <button id="btnPiu" class="btn btn-success">+</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
