<!--
  SOL-10 - Gestione prodotti con ricerca e totale
  Form nome+prezzo, tabella con ricerca oninput e totale filtrato.
  Concetti: filter, oninput, reduce per il totale, render()
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-10 - Gestione prodotti con ricerca e totale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 600px;">
    <h1 class="mb-4">Gestione prodotti</h1>

    <div class="row g-2 mb-3">
      <div class="col">
        <input type="text" id="inputNome" class="form-control" placeholder="Nome prodotto">
      </div>
      <div class="col">
        <input type="number" id="inputPrezzo" class="form-control" placeholder="Prezzo">
      </div>
    </div>

    <button id="btnAggiungi" class="btn btn-primary mb-4">Aggiungi</button>

    <input type="text" id="inputRicerca" class="form-control mb-3" placeholder="Cerca per nome...">

    <table class="table table-bordered">
      <thead><tr><th>Nome</th><th>Prezzo</th></tr></thead>
      <tbody id="tbodyProdotti"></tbody>
    </table>

    <div id="totale" class="alert alert-info">Totale: 0.00 EUR</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
