<!--
  SOL-07 - Tabella studenti
  Form nome+voto, righe con Promosso/Bocciato, pulsante Svuota.
  Concetti: array di dizionari, render(), template.replace()
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-07 - Tabella studenti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 600px;">
    <h1 class="mb-4">Tabella studenti</h1>

    <div class="row g-2 mb-3">
      <div class="col">
        <input type="text" id="inputNome" class="form-control" placeholder="Nome">
      </div>
      <div class="col">
        <input type="number" id="inputVoto" class="form-control" placeholder="Voto">
      </div>
    </div>

    <button id="btnAggiungi" class="btn btn-primary mb-2">Aggiungi</button>
    <button id="btnSvuota" class="btn btn-outline-danger mb-4">Svuota</button>

    <table class="table table-bordered">
      <thead><tr><th>Nome</th><th>Voto</th><th>Stato</th></tr></thead>
      <tbody id="tbodyStudenti"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
