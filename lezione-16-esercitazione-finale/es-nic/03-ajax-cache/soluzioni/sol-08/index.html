<!--
  SOL-08 - Cache remota SET + GET
  Due form nella stessa pagina: uno salva, uno legge dalla cache remota.
  Concetti: due fetch POST nella stessa pagina
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-08 - Cache remota SET + GET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">Cache remota: salva e leggi</h1>

    <h5>Salva</h5>
    <div class="row g-2 mb-3" style="max-width: 500px;">
      <div class="col">
        <input type="text" id="inputChiaveSalva" class="form-control" placeholder="Chiave">
      </div>
      <div class="col">
        <input type="text" id="inputValoreSalva" class="form-control" placeholder="Valore">
      </div>
    </div>
    <button id="btnSalva" class="btn btn-primary mb-4">Salva</button>
    <div id="esitoSalva" class="alert alert-secondary mb-5"></div>

    <h5>Leggi</h5>
    <div class="input-group mb-3" style="max-width: 400px;">
      <input type="text" id="inputChiaveLeggi" class="form-control" placeholder="Chiave">
      <button id="btnLeggi" class="btn btn-primary">Leggi</button>
    </div>
    <div id="esitoLeggi" class="alert alert-secondary"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
