<!--
  SOL-03 - Testo centrato
  Input + pulsante. Scrive il testo al centro del canvas.
  Concetti: fillText, textAlign, textBaseline, canvas.width/2
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-03 - Testo centrato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    canvas { border: 1px solid #ccc; display: block; margin: 20px auto; background: #fff; }
  </style>
</head>
<body>
  <div class="container text-center mt-4">
    <h1 class="mb-3">Testo centrato</h1>
    <div class="input-group mb-3" style="max-width: 400px; margin: 0 auto;">
      <input type="text" id="inputTesto" class="form-control" placeholder="Scrivi qualcosa...">
      <button id="btnScrivi" class="btn btn-primary">Scrivi</button>
    </div>
  </div>
  <canvas id="canvas" width="400" height="200"></canvas>

  <script src="script.js"></script>
</body>
</html>
