<!--
  SOL-08 - Media in tempo reale
  Form nome+voto, lista + media aggiornata ad ogni aggiunta.
  Concetti: array, reduce per la media, render()
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-08 - Media in tempo reale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Media in tempo reale</h1>

    <div class="row g-2 mb-3">
      <div class="col">
        <input type="text" id="inputNome" class="form-control" placeholder="Nome">
      </div>
      <div class="col">
        <input type="number" id="inputVoto" class="form-control" placeholder="Voto">
      </div>
    </div>

    <button id="btnAggiungi" class="btn btn-primary mb-2">Aggiungi</button>
    <button id="btnSvuota" class="btn btn-outline-danger mb-4">Svuota</button>

    <ul id="lista" class="list-group mb-3"></ul>

    <div id="media" class="alert alert-info">Media: -</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
