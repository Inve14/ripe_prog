<!--
  SOL-09 - PIN a 4 cifre
  4 input, "Imposta PIN" poi "Verifica PIN" con 3 tentativi.
  Concetti: variabili di stato, fasi della logica
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SOL-09 - PIN a 4 cifre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5 text-center" style="max-width: 500px;">
    <h1 class="mb-4">PIN a 4 cifre</h1>

    <div id="istruzioni" class="mb-3">Imposta un PIN a 4 cifre</div>

    <div class="mb-4">
      <input type="number" id="inputCifra1" class="form-control d-inline-block text-center mx-1" style="width: 60px;" min="0" max="9">
      <input type="number" id="inputCifra2" class="form-control d-inline-block text-center mx-1" style="width: 60px;" min="0" max="9">
      <input type="number" id="inputCifra3" class="form-control d-inline-block text-center mx-1" style="width: 60px;" min="0" max="9">
      <input type="number" id="inputCifra4" class="form-control d-inline-block text-center mx-1" style="width: 60px;" min="0" max="9">
    </div>

    <button id="btnImposta" class="btn btn-primary mb-3">Imposta PIN</button>
    <button id="btnVerifica" class="btn btn-success mb-3" style="display: none;">Verifica PIN</button>

    <div id="messaggio" class="alert alert-secondary" style="display: none;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
