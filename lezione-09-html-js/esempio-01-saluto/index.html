<!--
  Esempio 1 - Saluto personalizzato
  L'utente scrive il proprio nome in un input e clicca un pulsante.
  JavaScript legge il valore dell'input e scrive un saluto dentro un div.
  Concetti mostrati: querySelector, .value, onclick, innerHTML.
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 1 - Saluto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Saluto personalizzato</h1>

    <div class="mb-3">
      <label for="inputNome" class="form-label">Come ti chiami?</label>
      <input type="text" id="inputNome" class="form-control" placeholder="Scrivi il tuo nome">
    </div>

    <button id="btnSaluta" class="btn btn-primary">Saluta</button>

    <div id="risultato" class="alert alert-info mt-4"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
