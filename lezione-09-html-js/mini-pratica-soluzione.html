  Registro studenti con media in tempo reale.
  Stessa pagina della consegna, qui collegata allo script con la soluzione completa.

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Mini pratica - Registro studenti (soluzione)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Registro studenti</h1>

    <div class="row g-2 mb-3">
      <div class="col">
        <label for="inputNome" class="form-label">Nome</label>
        <input type="text" id="inputNome" class="form-control">
      </div>
      <div class="col">
        <label for="inputVoto" class="form-label">Voto</label>
        <input type="number" id="inputVoto" class="form-control">
      </div>
    </div>

    <button id="btnAggiungi" class="btn btn-primary mb-4">Aggiungi</button>

    <ul id="lista" class="list-group mb-3"></ul>

    <div id="media" class="alert alert-secondary"></div>
  </div>

  <script src="mini-pratica-soluzione.js"></script>
</body>
</html>
