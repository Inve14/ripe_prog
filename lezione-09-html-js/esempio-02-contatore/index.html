<!--
  Esempio 2 - Contatore
  Un numero mostrato in pagina che aumenta ad ogni click su "Aggiungi"
  e torna a 0 con "Azzera".
  Concetti mostrati: variabile esterna alla funzione (lo "stato"), aggiornamento del DOM.
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 2 - Contatore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5 text-center" style="max-width: 500px;">
    <h1 class="mb-4">Contatore</h1>

    <div id="numero" class="display-1 mb-4">0</div>

    <button id="btnAggiungi" class="btn btn-success me-2">Aggiungi</button>
    <button id="btnAzzera" class="btn btn-outline-danger">Azzera</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
