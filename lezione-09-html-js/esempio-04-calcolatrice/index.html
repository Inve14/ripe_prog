<!--
  Esempio 4 - Calcolatrice
  Due numeri, un select con l'operazione da fare, un pulsante "Calcola".
  Il risultato appare in un div.
  Concetti mostrati: parseFloat, if/else su stringa, isNaN per validare l'input.
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 4 - Calcolatrice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Calcolatrice</h1>

    <div class="row g-2 mb-3">
      <div class="col">
        <label for="numero1" class="form-label">Primo numero</label>
        <input type="number" id="numero1" class="form-control">
      </div>
      <div class="col">
        <label for="numero2" class="form-label">Secondo numero</label>
        <input type="number" id="numero2" class="form-control">
      </div>
    </div>

    <div class="mb-3">
      <label for="operazione" class="form-label">Operazione</label>
      <select id="operazione" class="form-select">
        <option value="+">+ (somma)</option>
        <option value="-">- (sottrazione)</option>
        <option value="*">* (moltiplicazione)</option>
        <option value="/">/ (divisione)</option>
      </select>
    </div>

    <button id="btnCalcola" class="btn btn-primary">Calcola</button>

    <div id="risultato" class="alert alert-info mt-4"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
