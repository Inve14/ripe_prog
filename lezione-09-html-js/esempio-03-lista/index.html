<!--
  Esempio 3 - Lista della spesa
  Un input e un pulsante "Aggiungi" inseriscono elementi in una lista ul.
  Un pulsante "Svuota" cancella tutta la lista.
  Concetti mostrati: array che tiene i dati + funzione render() che ridisegna la lista,
  innerHTML += per aggiungere un elemento alla volta dentro render().
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esempio 3 - Lista</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <h1 class="mb-4">Lista della spesa</h1>

    <div class="input-group mb-3">
      <input type="text" id="inputElemento" class="form-control" placeholder="Es. pane, latte...">
      <button id="btnAggiungi" class="btn btn-primary">Aggiungi</button>
    </div>

    <ul id="lista" class="list-group mb-3"></ul>

    <button id="btnSvuota" class="btn btn-outline-danger">Svuota</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
