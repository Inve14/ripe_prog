<!DOCTYPE html>
<!--
ESERCIZIO 1 — Saluto

Crea una pagina con:
- un campo di testo dove l'utente scrive il proprio nome
- un pulsante "Saluta"
- un div vuoto dove mostrare il risultato

Al click del pulsante, leggi il nome scritto e mostra nel div la scritta:
"Ciao [nome]!"

Concetti da usare: querySelector, .value, onclick, innerHTML
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ESERCIZIO 1 - Saluto</title>

</head>
<body>
    <div>
        <h1>saluto</h1>
    </div>
    
    <div>
    <label> il tuo nome </label>
    <input type="text" id="nome" placeholder="scrivi il tuo nome">
    </div>

    <button id = "btnsaluta" > saluta </button>
    <div id = "risultato">

    </div>
<script src="script.js"></script>

</body>
</html>
