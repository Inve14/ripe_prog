<!DOCTYPE html>
<!--
ESERCIZIO 5 — Calcolatrice — SOLUZIONE
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio 5 - Calcolatrice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h1 class="mb-4">Calcolatrice</h1>

        <div class="row g-2 mb-3">
            <div class="col">
                <input type="number" id="numero1" class="form-control" placeholder="Primo numero">
            </div>
            <div class="col-3">
                <select id="operazione" class="form-select">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">÷</option>
                </select>
            </div>
            <div class="col">
                <input type="number" id="numero2" class="form-control" placeholder="Secondo numero">
            </div>
        </div>

        <button id="btnCalcola" class="btn btn-primary">Calcola</button>

        <div id="risultato" class="mt-3 fs-4"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
