<!DOCTYPE html>
<!--
ESERCIZIO 11 — Salva e leggi (Cache Remota) — SOLUZIONE
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio 11 - Cache Remota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h1 class="mb-4">Cache Remota</h1>

        <h5>Salva un valore</h5>
        <form id="formSalva" class="row g-2 mb-2">
            <div class="col">
                <input type="text" id="chiaveSalva" class="form-control" placeholder="Chiave" required>
            </div>
            <div class="col">
                <input type="text" id="valoreSalva" class="form-control" placeholder="Valore" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Salva</button>
            </div>
        </form>
        <div id="messaggioSalva" class="mb-4"></div>

        <h5>Leggi un valore</h5>
        <form id="formLeggi" class="row g-2 mb-2">
            <div class="col">
                <input type="text" id="chiaveLeggi" class="form-control" placeholder="Chiave" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Leggi</button>
            </div>
        </form>
        <div id="messaggioLeggi"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
