<!DOCTYPE html>
<!--
ESERCIZIO 1 — Saluto — SOLUZIONE

Input testo + pulsante. Al click mostra "Ciao [nome]!" in un div.
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio 1 - Saluto</title>
    <!-- Bootstrap per uno stile pulito senza scrivere CSS a mano -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h1 class="mb-4">Saluto</h1>

        <!-- Campo dove l'utente scrive il proprio nome -->
        <div class="mb-3">
            <label class="form-label">Il tuo nome</label>
            <input type="text" id="nome" class="form-control" placeholder="Scrivi il tuo nome">
        </div>

        <!-- onclick collegato direttamente qui: la funzione saluta() è definita in script.js -->
        <button id="btnSaluta" class="btn btn-primary">Saluta</button>

        <!-- Div vuoto: verrà riempito da JS con innerHTML -->
        <div id="risultato" class="mt-3 fs-4"></div>
    </div>

    <!-- Lo script va DOPO il body così, quando parte, gli elementi sopra esistono già -->
    <script src="script.js"></script>
</body>
</html>
