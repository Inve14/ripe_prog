<!DOCTYPE html>
<!--
ESERCIZIO 3 — Contatore con limite — SOLUZIONE
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio 3 - Contatore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 text-center" style="max-width: 400px;">
        <h1 class="mb-4">Contatore (0 - 10)</h1>

        <!-- Il numero mostrato: viene aggiornato solo da render(), mai scritto a mano altrove -->
        <div id="numero" class="display-3 mb-4">0</div>

        <button id="btnMeno" class="btn btn-danger">-</button>
        <button id="btnPiu" class="btn btn-success">+</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
