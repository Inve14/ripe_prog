<!DOCTYPE html>
<!--
ESERCIZIO 10 — CocktailDB (AJAX con gestione dei dati mancanti) — SOLUZIONE
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio 10 - CocktailDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="mb-4">Cerca un cocktail</h1>

        <div class="input-group mb-3">
            <input type="text" id="nomeCocktail" class="form-control" placeholder="Es. margarita">
            <button id="btnCerca" class="btn btn-primary">Cerca</button>
        </div>

        <div id="messaggio" class="mb-2 text-danger"></div>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Immagine</th>
                </tr>
            </thead>
            <tbody id="corpoTabella"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
